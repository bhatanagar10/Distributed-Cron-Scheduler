spring:
  application:
    name: Distributed_Cron_Scheduler

  # ── PostgreSQL DataSource ────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/crondb?options=-c%20timezone=Asia/Kolkata
    username: cron
    password: cron
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CronHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 50
        order_updates: true

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis ───────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1               # Each worker pulls up to 1 messages at once
        concurrency: 10
        max-concurrency: 20
  output:
    ansi:
      enabled: ALWAYS

# ── Custom Scheduler Properties ─────────────────────────────────────────────
scheduler:
  poll-interval-ms: 1000          # How often the Manager polls Redis ZSET for due jobs (ms)
  delay-threshold-ms: 2000        # Default drift threshold for /delays endpoint (ms)
  http-timeout-seconds: 30        # Max wait for an HTTP response from the target
  redis-zset-key: cron:schedule   # Redis ZSET key used as the scheduling index

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.cron.distributed_cron_scheduler: DEBUG
    org.springframework.amqp: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){cyan} %clr(%-5level) %clr(%logger{36}){yellow} - %msg%n"
